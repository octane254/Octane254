name: Generate Cursed Spirit Snake

on:
  # Automatic exorcism every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Manual cursed technique activation
  workflow_dispatch:
  
  # Trigger on domain expansion (push to main)
  push:
    branches:
      - main

jobs:
  generate-cursed-spirit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Summon the repository
      - name: Summon Repository
        uses: actions/checkout@v3
      
      # Domain Expansion - Generate Cursed Spirit
      - name: Domain Expansion - Cursed Spirit Generation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: octane254
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#9D4EDD&color_dots=#1a1a2e,#7B2CBF,#9D4EDD,#C77DFF,#E0AAFF
      
      # Seal cursed spirit in output domain
      - name: Seal in Output Domain
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}