<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 80" width="560" height="80">
  <defs>
    <style>
      /* Pac-Man mouth animation */
      @keyframes munch {
        0%   { d: path("M 30,40 L 55,20 A 25,25 0 1,1 55,60 Z"); }
        50%  { d: path("M 30,40 L 55,38 A 25,25 0 1,1 55,42 Z"); }
        100% { d: path("M 30,40 L 55,20 A 25,25 0 1,1 55,60 Z"); }
      }

      @keyframes pacmove {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(470px); }
      }

      @keyframes ghostmove {
        0%   { transform: translateX(-60px); }
        100% { transform: translateX(410px); }
      }

      @keyframes ghost2move {
        0%   { transform: translateX(-110px); }
        100% { transform: translateX(360px); }
      }

      @keyframes ghost3move {
        0%   { transform: translateX(-160px); }
        100% { transform: translateX(310px); }
      }

      @keyframes doteat {
        0%,  7%  { opacity: 1; }
        8%,  100% { opacity: 0; }
      }
      @keyframes dot2eat {
        0%,  14% { opacity: 1; }
        15%, 100% { opacity: 0; }
      }
      @keyframes dot3eat {
        0%,  21% { opacity: 1; }
        22%, 100% { opacity: 0; }
      }
      @keyframes dot4eat {
        0%,  28% { opacity: 1; }
        29%, 100% { opacity: 0; }
      }
      @keyframes dot5eat {
        0%,  35% { opacity: 1; }
        36%, 100% { opacity: 0; }
      }
      @keyframes dot6eat {
        0%,  42% { opacity: 1; }
        43%, 100% { opacity: 0; }
      }
      @keyframes dot7eat {
        0%,  49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes dot8eat {
        0%,  56% { opacity: 1; }
        57%, 100% { opacity: 0; }
      }
      @keyframes dot9eat {
        0%,  63% { opacity: 1; }
        64%, 100% { opacity: 0; }
      }
      @keyframes dot10eat {
        0%,  70% { opacity: 1; }
        71%, 100% { opacity: 0; }
      }
      @keyframes dot11eat {
        0%,  77% { opacity: 1; }
        78%, 100% { opacity: 0; }
      }
      @keyframes dot12eat {
        0%,  84% { opacity: 1; }
        85%, 100% { opacity: 0; }
      }
      @keyframes powereat {
        0%,  91% { opacity: 1; r: 7; }
        92%, 100% { opacity: 0; r: 7; }
      }

      @keyframes frightened {
        0%,  91% { fill: #FF6B6B; }
        92%, 100% { fill: #4B0082; }
      }
      @keyframes frightened2 {
        0%,  91% { fill: #FFB3DE; }
        92%, 100% { fill: #4B0082; }
      }
      @keyframes frightened3 {
        0%,  91% { fill: #00D4FF; }
        92%, 100% { fill: #4B0082; }
      }

      @keyframes scorepop {
        0%,  91%  { opacity: 0; transform: translateY(0); }
        92%       { opacity: 1; transform: translateY(0); }
        100%      { opacity: 0; transform: translateY(-15px); }
      }

      .pacman-group {
        animation: pacmove 4s linear infinite;
      }
      .ghost1-group {
        animation: ghostmove 4s linear infinite;
      }
      .ghost2-group {
        animation: ghost2move 4s linear infinite;
      }
      .ghost3-group {
        animation: ghost3move 4s linear infinite;
      }
      .d1  { animation: doteat   4s linear infinite; }
      .d2  { animation: dot2eat  4s linear infinite; }
      .d3  { animation: dot3eat  4s linear infinite; }
      .d4  { animation: dot4eat  4s linear infinite; }
      .d5  { animation: dot5eat  4s linear infinite; }
      .d6  { animation: dot6eat  4s linear infinite; }
      .d7  { animation: dot7eat  4s linear infinite; }
      .d8  { animation: dot8eat  4s linear infinite; }
      .d9  { animation: dot9eat  4s linear infinite; }
      .d10 { animation: dot10eat 4s linear infinite; }
      .d11 { animation: dot11eat 4s linear infinite; }
      .d12 { animation: dot12eat 4s linear infinite; }
      .pw  { animation: powereat 4s linear infinite; }
    </style>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="80" fill="#0D1117" rx="6"/>

  <!-- Track line -->
  <line x1="10" y1="40" x2="550" y2="40" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Dots (evenly spaced, Pac-Man eats them as he passes) -->
  <circle class="d1"  cx="55"  cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d2"  cx="95"  cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d3"  cx="135" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d4"  cx="175" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d5"  cx="215" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d6"  cx="255" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d7"  cx="295" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d8"  cx="335" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d9"  cx="375" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d10" cx="415" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d11" cx="455" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>
  <circle class="d12" cx="495" cy="40" r="4" fill="#FFD700" filter="url(#glow)"/>

  <!-- Power pellet at the end -->
  <circle class="pw"  cx="530" cy="40" r="7" fill="#FF6B6B" filter="url(#softglow)"/>

  <!-- Ghost 3 (Inky - cyan, furthest back) -->
  <g class="ghost3-group" filter="url(#glow)">
    <path d="M 15,55 Q 15,28 30,28 Q 45,28 45,55 Q 41,51 37,55 Q 33,51 30,55 Q 27,51 23,55 Q 19,51 15,55 Z">
      <animate attributeName="fill" values="#00D4FF;#4B0082;#00D4FF" keyTimes="0;0.92;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="24" cy="38" r="4" fill="white"/>
    <circle cx="36" cy="38" r="4" fill="white"/>
    <circle cx="25" cy="38" r="2" fill="#001f8a"/>
    <circle cx="37" cy="38" r="2" fill="#001f8a"/>
  </g>

  <!-- Ghost 2 (Pinky - pink, middle) -->
  <g class="ghost2-group" filter="url(#glow)">
    <path d="M 15,55 Q 15,28 30,28 Q 45,28 45,55 Q 41,51 37,55 Q 33,51 30,55 Q 27,51 23,55 Q 19,51 15,55 Z">
      <animate attributeName="fill" values="#FFB3DE;#4B0082;#FFB3DE" keyTimes="0;0.92;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="24" cy="38" r="4" fill="white"/>
    <circle cx="36" cy="38" r="4" fill="white"/>
    <circle cx="25" cy="38" r="2" fill="#001f8a"/>
    <circle cx="37" cy="38" r="2" fill="#001f8a"/>
  </g>

  <!-- Ghost 1 (Blinky - red, closest) -->
  <g class="ghost1-group" filter="url(#glow)">
    <path d="M 15,55 Q 15,28 30,28 Q 45,28 45,55 Q 41,51 37,55 Q 33,51 30,55 Q 27,51 23,55 Q 19,51 15,55 Z">
      <animate attributeName="fill" values="#FF6B6B;#4B0082;#FF6B6B" keyTimes="0;0.92;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="24" cy="38" r="4" fill="white"/>
    <circle cx="36" cy="38" r="4" fill="white"/>
    <circle cx="25" cy="38" r="2" fill="#001f8a"/>
    <circle cx="37" cy="38" r="2" fill="#001f8a"/>
  </g>

  <!-- Pac-Man (moving, mouth chomping) -->
  <g class="pacman-group" filter="url(#glow)">
    <!-- Body -->
    <circle cx="30" cy="40" r="22" fill="#FFD700"/>
    <!-- Mouth (open) - animated via clip -->
    <polygon fill="#0D1117">
      <animate attributeName="points"
        values="30,40 55,22 55,58;30,40 55,38 55,42;30,40 55,22 55,58"
        dur="0.25s" repeatCount="indefinite"/>
    </polygon>
    <!-- Eye -->
    <circle cx="34" cy="24" r="3" fill="#0D1117"/>
  </g>

  <!-- Score popup when power pellet eaten -->
  <text x="510" y="30" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00FFB3" text-anchor="middle">
    +200
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.91;0.93;1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-5;0,-15" keyTimes="0;0.91;0.94;1" dur="4s" repeatCount="indefinite" additive="sum"/>
  </text>

</svg>
