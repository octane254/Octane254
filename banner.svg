<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200">
  <defs>
    <style>
      @keyframes flicker{0%,100%{opacity:1}91%{opacity:1}92%{opacity:0.2}93%{opacity:1}96%{opacity:0.4}97%{opacity:1}}
      @keyframes float1{0%{transform:translate(0,0)}33%{transform:translate(7px,-9px)}66%{transform:translate(-5px,6px)}100%{transform:translate(0,0)}}
      @keyframes float2{0%{transform:translate(0,0)}25%{transform:translate(-9px,7px)}75%{transform:translate(6px,-5px)}100%{transform:translate(0,0)}}
      @keyframes float3{0%{transform:translate(0,0)}40%{transform:translate(11px,-7px)}80%{transform:translate(-4px,9px)}100%{transform:translate(0,0)}}
      @keyframes slash{0%,82%,100%{opacity:0}86%{opacity:1}94%{opacity:0}}
      @keyframes cursed{0%{stroke-dashoffset:1200;opacity:0}8%{opacity:0.7}88%{opacity:0.3}100%{stroke-dashoffset:0;opacity:0}}
      @keyframes eye{0%,100%{opacity:0.3}50%{opacity:1}}
      @keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes drip{0%,65%{transform:translateY(0);opacity:0}70%{opacity:1}100%{transform:translateY(40px);opacity:0}}
      @keyframes seal-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes seal-pulse{0%,100%{opacity:0.15}50%{opacity:0.35}}
      @keyframes title-shimmer{0%,100%{fill:#ff2020}50%{fill:#ff6666}}
      .title{animation:flicker 7s infinite}
      .p1{animation:float1 4s ease-in-out infinite}
      .p2{animation:float2 5.5s ease-in-out infinite}
      .p3{animation:float3 6.5s ease-in-out infinite}
      .s1{animation:slash 6s ease-in-out infinite}
      .s2{animation:slash 6s ease-in-out infinite 3s}
      .c1{animation:cursed 9s linear infinite}
      .c2{animation:cursed 11s linear infinite 2s}
      .c3{animation:cursed 13s linear infinite 4s}
      .eye{animation:eye 2.5s ease-in-out infinite}
      .sub{animation:rise 3.5s ease-in-out infinite}
      .d1{animation:drip 4s ease-in infinite}
      .d2{animation:drip 4s ease-in infinite 1.5s}
      .d3{animation:drip 4s ease-in infinite 2.8s}
      .seal{animation:seal-pulse 3s ease-in-out infinite}
    </style>
    <filter id="rg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sg"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="tg"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#200000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1010" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff1010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff0000" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="40%" stop-color="#ff0000"/>
      <stop offset="60%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="url(#bg)" rx="10"/>

  <!-- Cursed energy flows -->
  <path class="c1" d="M0,100 Q140,50 280,100 Q420,150 560,100 Q700,50 860,100" fill="none" stroke="#8b0000" stroke-width="1.2" stroke-dasharray="1200" stroke-dashoffset="1200" opacity="0.5"/>
  <path class="c2" d="M0,70 Q180,120 360,70 Q540,20 720,70 Q800,90 860,70" fill="none" stroke="#cc0000" stroke-width="0.7" stroke-dasharray="1200" stroke-dashoffset="1200" opacity="0.3"/>
  <path class="c3" d="M0,140 Q200,90 400,140 Q600,185 860,140" fill="none" stroke="#ff2020" stroke-width="0.5" stroke-dasharray="1200" stroke-dashoffset="1200" opacity="0.2"/>

  <!-- Glow orb -->
  <ellipse cx="430" cy="100" rx="240" ry="100" fill="url(#orb)"/>

  <!-- Talisman seals - left -->
  <g class="seal" transform="translate(55,100)">
    <polygon points="0,-38 11,-12 38,-12 17,5 26,32 0,16 -26,32 -17,5 -38,-12 -11,-12" fill="none" stroke="#8b0000" stroke-width="1.2"/>
    <polygon points="0,-24 7,-8 24,-8 11,3 17,21 0,10 -17,21 -11,3 -24,-8 -7,-8" fill="none" stroke="#cc0000" stroke-width="0.7"/>
    <text x="0" y="6" font-family="serif" font-size="14" fill="#8b0000" text-anchor="middle" font-weight="bold">封</text>
  </g>

  <!-- Talisman seals - right -->
  <g class="seal" transform="translate(805,100)">
    <polygon points="0,-38 11,-12 38,-12 17,5 26,32 0,16 -26,32 -17,5 -38,-12 -11,-12" fill="none" stroke="#8b0000" stroke-width="1.2"/>
    <polygon points="0,-24 7,-8 24,-8 11,3 17,21 0,10 -17,21 -11,3 -24,-8 -7,-8" fill="none" stroke="#cc0000" stroke-width="0.7"/>
    <text x="0" y="6" font-family="serif" font-size="14" fill="#8b0000" text-anchor="middle" font-weight="bold">滅</text>
  </g>

  <!-- Blood drips -->
  <rect class="d1" x="198" y="0" width="3" height="20" fill="#cc0000" rx="2" filter="url(#sg)"/>
  <rect class="d2" x="430" y="0" width="3" height="25" fill="#cc0000" rx="2" filter="url(#sg)"/>
  <rect class="d3" x="662" y="0" width="3" height="18" fill="#cc0000" rx="2" filter="url(#sg)"/>

  <!-- Floating particles -->
  <g class="p1"><circle cx="110" cy="40"  r="3.5" fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p2"><circle cx="160" cy="165" r="2.5" fill="#cc0000" filter="url(#sg)"/></g>
  <g class="p3"><circle cx="750" cy="45"  r="3"   fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p1"><circle cx="700" cy="170" r="2"   fill="#8b0000" filter="url(#sg)"/></g>
  <g class="p2"><circle cx="320" cy="22"  r="2.5" fill="#ff4444" filter="url(#sg)"/></g>
  <g class="p3"><circle cx="560" cy="178" r="3"   fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p1"><circle cx="430" cy="15"  r="2"   fill="#cc0000" filter="url(#sg)"/></g>
  <g class="p2"><circle cx="220" cy="182" r="2.5" fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p3"><circle cx="640" cy="28"  r="2"   fill="#ff4444" filter="url(#sg)"/></g>
  <g class="p1"><circle cx="130" cy="148" r="2"   fill="#cc0000" filter="url(#sg)"/></g>

  <!-- Slash effects -->
  <line class="s1" x1="130" y1="8"   x2="320" y2="188" stroke="url(#sg2)" stroke-width="2.5" filter="url(#sg)"/>
  <line class="s2" x1="540" y1="8"   x2="730" y2="188" stroke="url(#sg2)" stroke-width="2.5" filter="url(#sg)"/>

  <!-- Kanji watermarks -->
  <text x="108" y="140" font-family="serif" font-size="90" fill="#8b0000" opacity="0.08" font-weight="bold">呪</text>
  <text x="630" y="140" font-family="serif" font-size="90" fill="#8b0000" opacity="0.08" font-weight="bold">力</text>

  <!-- Corner ornaments -->
  <path d="M10,10 L45,10 L45,15 L15,15 L15,45 L10,45 Z" fill="#8b0000" opacity="0.6"/>
  <path d="M850,10 L815,10 L815,15 L845,15 L845,45 L850,45 Z" fill="#8b0000" opacity="0.6"/>
  <path d="M10,190 L45,190 L45,185 L15,185 L15,155 L10,155 Z" fill="#8b0000" opacity="0.6"/>
  <path d="M850,190 L815,190 L815,185 L845,185 L845,155 L850,155 Z" fill="#8b0000" opacity="0.6"/>

  <!-- Decorative lines -->
  <line x1="100" y1="72" x2="335" y2="72" stroke="#8b0000" stroke-width="0.9" opacity="0.7"/>
  <line x1="525" y1="72" x2="760" y2="72" stroke="#8b0000" stroke-width="0.9" opacity="0.7"/>

  <!-- Center diamond -->
  <polygon points="430,62 442,72 430,82 418,72" fill="none" stroke="#cc0000" stroke-width="1.3" filter="url(#sg)" opacity="0.9"/>
  <circle class="eye" cx="430" cy="72" r="2.5" fill="#ff2020" filter="url(#rg)"/>

  <!-- Main title -->
  <text class="title" x="430" y="122" font-family="'Georgia','Times New Roman',serif" font-size="50" font-weight="700" fill="url(#tg2)" text-anchor="middle" letter-spacing="12" filter="url(#tg)">ERIC MBITHI</text>

  <!-- Subtitle -->
  <text class="sub" x="430" y="155" font-family="'Courier New',monospace" font-size="12" fill="#cc4444" text-anchor="middle" letter-spacing="4" opacity="0.95">⚔  CURSED ENERGY: FULL STACK DEVELOPER  ·  ROAD TO THE TOP  ⚔</text>

  <!-- Bottom line -->
  <line x1="155" y1="174" x2="705" y2="174" stroke="#8b0000" stroke-width="0.8" opacity="0.45"/>

  <!-- Mini anime icons row -->
  <text x="250" y="190" font-family="serif" font-size="11" fill="#8b0000" opacity="0.5" text-anchor="middle">ONE PIECE</text>
  <text x="340" y="190" font-family="serif" font-size="11" fill="#8b0000" opacity="0.5" text-anchor="middle">·  JJK  ·</text>
  <text x="430" y="190" font-family="serif" font-size="11" fill="#8b0000" opacity="0.5" text-anchor="middle">NARUTO</text>
  <text x="520" y="190" font-family="serif" font-size="11" fill="#8b0000" opacity="0.5" text-anchor="middle">·  AOT  ·</text>
  <text x="610" y="190" font-family="serif" font-size="11" fill="#8b0000" opacity="0.5" text-anchor="middle">BLEACH</text>
</svg>
