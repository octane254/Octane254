<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="860" height="180">
  <defs>
    <style>
      @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:0.3}94%{opacity:1}97%{opacity:0.5}98%{opacity:1}}
      @keyframes float1{0%{transform:translate(0,0)}33%{transform:translate(6px,-8px)}66%{transform:translate(-4px,5px)}100%{transform:translate(0,0)}}
      @keyframes float2{0%{transform:translate(0,0)}25%{transform:translate(-8px,6px)}75%{transform:translate(5px,-4px)}100%{transform:translate(0,0)}}
      @keyframes float3{0%{transform:translate(0,0)}40%{transform:translate(10px,-6px)}80%{transform:translate(-3px,8px)}100%{transform:translate(0,0)}}
      @keyframes slash{0%,85%,100%{opacity:0}88%{opacity:1}95%{opacity:0}}
      @keyframes cursed{0%{stroke-dashoffset:1000;opacity:0}10%{opacity:0.6}90%{opacity:0.3}100%{stroke-dashoffset:0;opacity:0}}
      @keyframes eye-glow{0%,100%{opacity:0.4}50%{opacity:1}}
      @keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes spin-slow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes blood-drip{0%,70%{transform:translateY(0);opacity:0}75%{opacity:1}100%{transform:translateY(30px);opacity:0}}
      .title{animation:flicker 6s infinite}
      .p1{animation:float1 4s ease-in-out infinite}
      .p2{animation:float2 5s ease-in-out infinite}
      .p3{animation:float3 6s ease-in-out infinite}
      .slash1{animation:slash 5s ease-in-out infinite}
      .slash2{animation:slash 5s ease-in-out infinite 2.5s}
      .c1{animation:cursed 8s linear infinite}
      .c2{animation:cursed 10s linear infinite 2s}
      .c3{animation:cursed 12s linear infinite 4s}
      .eye{animation:eye-glow 2s ease-in-out infinite}
      .sub{animation:rise 3s ease-in-out infinite}
      .drip1{animation:blood-drip 4s ease-in infinite}
      .drip2{animation:blood-drip 4s ease-in infinite 1.3s}
      .drip3{animation:blood-drip 4s ease-in infinite 2.7s}
    </style>
    <filter id="rg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sg"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="tg"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="bg-g" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1f0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1010" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff1010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slash-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff0000" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6666"/>
      <stop offset="50%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#ff6666"/>
    </linearGradient>
  </defs>

  <rect width="860" height="180" fill="url(#bg-g)" rx="10"/>

  <!-- Cursed energy lines -->
  <path class="c1" d="M0,90 Q150,45 300,90 Q450,135 600,90 Q720,55 860,90" fill="none" stroke="#8b0000" stroke-width="1" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="0.5"/>
  <path class="c2" d="M0,60 Q200,110 400,60 Q600,10 860,60" fill="none" stroke="#cc0000" stroke-width="0.6" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="0.3"/>
  <path class="c3" d="M0,130 Q250,80 500,130 Q700,165 860,130" fill="none" stroke="#ff2020" stroke-width="0.5" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="0.2"/>

  <!-- Glow orb -->
  <ellipse cx="430" cy="90" rx="220" ry="90" fill="url(#orb)"/>

  <!-- Blood drips from top -->
  <rect class="drip1" x="200" y="0" width="3" height="18" fill="#cc0000" rx="2" filter="url(#sg)"/>
  <rect class="drip2" x="430" y="0" width="3" height="22" fill="#cc0000" rx="2" filter="url(#sg)"/>
  <rect class="drip3" x="660" y="0" width="3" height="16" fill="#cc0000" rx="2" filter="url(#sg)"/>

  <!-- Floating particles -->
  <g class="p1"><circle cx="55"  cy="35"  r="3.5" fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p2"><circle cx="130" cy="145" r="2.5" fill="#cc0000" filter="url(#sg)"/></g>
  <g class="p3"><circle cx="790" cy="40"  r="3"   fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p1"><circle cx="720" cy="150" r="2"   fill="#8b0000" filter="url(#sg)"/></g>
  <g class="p2"><circle cx="310" cy="18"  r="2.5" fill="#ff4444" filter="url(#sg)"/></g>
  <g class="p3"><circle cx="560" cy="162" r="3"   fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p1"><circle cx="430" cy="12"  r="2"   fill="#cc0000" filter="url(#sg)"/></g>
  <g class="p2"><circle cx="185" cy="158" r="2.5" fill="#ff2020" filter="url(#sg)"/></g>
  <g class="p3"><circle cx="650" cy="25"  r="2"   fill="#ff4444" filter="url(#sg)"/></g>
  <g class="p1"><circle cx="85"  cy="120" r="2"   fill="#cc0000" filter="url(#sg)"/></g>

  <!-- Slash effects -->
  <line class="slash1" x1="100" y1="5"   x2="290" y2="170" stroke="url(#slash-g)" stroke-width="2" filter="url(#sg)"/>
  <line class="slash2" x1="570" y1="5"   x2="760" y2="170" stroke="url(#slash-g)" stroke-width="2" filter="url(#sg)"/>

  <!-- Kanji watermarks -->
  <text x="20"  y="120" font-family="serif" font-size="80" fill="#8b0000" opacity="0.10" font-weight="bold">呪</text>
  <text x="758" y="120" font-family="serif" font-size="80" fill="#8b0000" opacity="0.10" font-weight="bold">力</text>
  <text x="375" y="175" font-family="serif" font-size="40" fill="#8b0000" opacity="0.07" font-weight="bold">滅</text>

  <!-- Decorative frame lines -->
  <line x1="80"  y1="62" x2="340" y2="62" stroke="#8b0000" stroke-width="0.8" opacity="0.7"/>
  <line x1="520" y1="62" x2="780" y2="62" stroke="#8b0000" stroke-width="0.8" opacity="0.7"/>
  <polygon points="430,54 440,62 430,70 420,62" fill="none" stroke="#cc0000" stroke-width="1.2" filter="url(#sg)" opacity="0.9"/>
  <circle class="eye" cx="430" cy="62" r="2" fill="#ff2020" filter="url(#rg)"/>

  <!-- Corner ornaments -->
  <path d="M10,10 L40,10 L40,14 L14,14 L14,40 L10,40 Z" fill="#8b0000" opacity="0.5"/>
  <path d="M850,10 L820,10 L820,14 L846,14 L846,40 L850,40 Z" fill="#8b0000" opacity="0.5"/>
  <path d="M10,170 L40,170 L40,166 L14,166 L14,140 L10,140 Z" fill="#8b0000" opacity="0.5"/>
  <path d="M850,170 L820,170 L820,166 L846,166 L846,140 L850,140 Z" fill="#8b0000" opacity="0.5"/>

  <!-- Main title -->
  <text class="title" x="430" y="115" font-family="'Georgia','Times New Roman',serif" font-size="46" font-weight="700" fill="url(#title-g)" text-anchor="middle" letter-spacing="10" filter="url(#tg)">ERIC MBITHI</text>

  <!-- Subtitle -->
  <text class="sub" x="430" y="145" font-family="'Courier New',monospace" font-size="11.5" fill="#cc4444" text-anchor="middle" letter-spacing="4" opacity="0.95">⚔  CURSED ENERGY: FULL STACK DEVELOPER  ·  UNSTOPPABLE  ⚔</text>

  <!-- Bottom line -->
  <line x1="140" y1="162" x2="720" y2="162" stroke="#8b0000" stroke-width="0.7" opacity="0.45"/>
</svg>
